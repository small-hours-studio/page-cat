<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Page Cat</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="top">
    <img src="icons/icon32.png" alt="" width="20" height="20">
    <h1>Page Cat</h1>
    <span class="mood" id="mood" hidden></span>
  </header>

  <section class="here">
    <button id="summon" class="primary" type="button">Call the cat here</button>
    <p id="note" class="note" hidden></p>
    <label class="switch"><input type="checkbox" id="always"><span>Show on every site</span></label>
    <label class="switch sub" id="siteRow" hidden><input type="checkbox" id="site"><span>Hide on <b id="host">this site</b></span></label>
  </section>

  <section>
    <h2>Look</h2>
    <div class="field">
      <label for="size">Size</label>
      <input type="range" id="size" min="20" max="64" step="1">
      <output id="sizeOut" for="size"></output>
    </div>
    <div class="field">
      <label for="girth">Girth</label>
      <input type="range" id="girth" min="0.8" max="1.8" step="0.05">
      <output id="girthOut" for="girth"></output>
    </div>
    <div class="field col">
      <span class="lbl">Coat</span>
      <div class="swatches" id="coats" role="radiogroup" aria-label="Coat color"></div>
    </div>
    <div class="field col">
      <span class="lbl">Pattern</span>
      <div class="chips" id="patterns" role="radiogroup" aria-label="Coat pattern"></div>
      <p class="note" id="calicoNote" hidden>Calico cats are white with orange and black patches, so the coat color doesn't apply.</p>
    </div>
  </section>

  <section>
    <h2>Behavior</h2>
    <div class="field">
      <label for="activity" id="activityLbl">Energy</label>
      <input type="range" id="activity" min="0" max="1" step="0.05">
      <output id="activityOut" for="activity"></output>
    </div>
    <label class="switch"><input type="checkbox" id="moodCycle"><span>Moods change over time</span></label>
    <label class="switch"><input type="checkbox" id="pagePlay"><span>Plays with icons and words</span></label>
    <label class="switch"><input type="checkbox" id="cursorPlay"><span>Notices your cursor</span></label>
  </section>

  <footer>
    <span>Shortcut: <kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>C</kbd></span>
    <button id="reset" class="link" type="button">Reset</button>
  </footer>
  <script type="module" src="popup.js"></script>
</body>
</html>
